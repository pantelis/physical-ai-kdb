[project]
name = "kdb-agent"
version = "0.1.0"
description = "Starter for your Physical AI kDB agent: Pydantic AI plumbing, no extraction"
requires-python = ">=3.11"
dependencies = [
    "physical-ai-kdb",
    "kdb-tools[agent,s3]",
    "pydantic-ai-slim[openai]==2.58.0",
    "pdfplumber>=0.11",
]

[project.scripts]
kdb = "kdbagent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "fpdf2>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kdbagent"]

[tool.uv.sources]
# During development both come from the neighboring checkouts; release pins them to tags.
physical-ai-kdb = { path = "..", editable = true }
kdb-tools = { path = "../../kdb-tools", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
