[project]
name = "kdb-tools"
version = "0.1.0"
description = "Checks for the Physical AI kDB project: OKF validation, grounding against PDFs, and snapshot diffs"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pyyaml>=6",
    "pdfplumber>=0.11",
    "pypdf>=5",
]

[project.scripts]
okf-validate = "kdb_tools.validate:main"
okf-ground = "kdb_tools.ground:main"
okf-diff = "kdb_tools.diff:main"
okf-seed = "kdb_tools.seed:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "reportlab>=4",
    "pypdf>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kdb_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
