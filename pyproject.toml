[project]
name = "paiw-tools"
version = "0.1.0"
description = "Checks for the Physical AI Wiki project: OKF validation, grounding against PDFs, and snapshot diffs"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pyyaml>=6",
    "pdfplumber>=0.11",
    "pypdf>=5",
]

[project.scripts]
okf-validate = "paiw_tools.validate:main"
okf-ground = "paiw_tools.ground:main"
okf-diff = "paiw_tools.diff:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "reportlab>=4",
    "pypdf>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paiw_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
